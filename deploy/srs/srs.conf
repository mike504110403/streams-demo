listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

rtc_server {
    enabled         on;
    listen          8000;
}

vhost __defaultVhost__ {
    # TCP 優化：降低延遲
    tcp_nodelay     on;
    min_latency     on;

    # 發布端（OBS 推流）佇列設定
    publish {
        mr          off;
    }

    # 播放端佇列設定
    play {
        gop_cache       off;
        queue_length    10;
        mw_latency      100;
    }

    # HTTP-FLV 輸出
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # HLS 輸出
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    # 後端 Callback
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:8081/api/v1/internal/srs/on_publish;
        on_unpublish    http://host.docker.internal:8081/api/v1/internal/srs/on_unpublish;
        on_play         http://host.docker.internal:8081/api/v1/internal/srs/on_play;
        on_stop         http://host.docker.internal:8081/api/v1/internal/srs/on_stop;
    }
}
